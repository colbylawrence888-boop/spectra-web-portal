<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d18">
<title>SPECTRA Browser</title>
<style>
:root{color-scheme:dark;--bg:#0b0d18;--bar:#171a2a;--border:#30354c;--text:#f1f1ff;--muted:#929ab8;--accent:#a88cff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-size:13px}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100dvh;display:flex;flex-direction:column}
.top{height:49px;flex:none;display:flex;gap:7px;align-items:end;background:#0b0d18;padding:6px 13px 0}
.brand{display:flex;align-items:center;gap:9px;padding:0 14px 10px 2px;font-weight:900;font-size:14px;letter-spacing:1.3px;white-space:nowrap}
.mark{width:25px;height:25px;background:linear-gradient(145deg,#b6a3ff,#6558ec);border-radius:8px;display:grid;place-items:center;font-weight:900;color:white;box-shadow:0 0 21px #8953e344}
.tabs{display:flex;flex:1;min-width:0;overflow:auto;scrollbar-width:none;gap:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;flex:0 1 180px;min-width:112px;max-width:190px;padding:0 8px;color:#969ab6;min-height:38px;border:1px solid transparent;border-bottom:0;border-radius:12px 12px 0 0;background:transparent;text-align:left}
.tab.active{background:var(--bar);color:white;border-color:var(--border)}
.tab:hover{background:#1f2236}
.tab .symbol{color:var(--accent);font-size:18px}
.tab .title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;font-size:11px;font-weight:700}
.tab .close{border:0;background:none;color:#b3b1c6;border-radius:6px;padding:1px 6px;font-size:18px}
.tab .close:hover{background:#3f3b59}
.new{align-self:center;margin-bottom:5px;width:33px;height:33px;border:0;border-radius:9px;background:transparent;color:#c0bed6;font-size:23px}
.new:hover{background:#252940}
.toolbar{display:flex;gap:5px;align-items:center;height:63px;flex:none;padding:9px 12px;background:var(--bar);border-bottom:1px solid var(--border)}
.tool{display:grid;place-items:center;background:none;border:0;border-radius:9px;flex:none;color:#bec2d8;width:36px;height:36px;font-size:20px}
.tool:hover:not(:disabled){background:#292c42;color:white}
.tool:disabled{opacity:.3;cursor:default}
.form{height:42px;display:flex;align-items:center;gap:9px;flex:1;min-width:0;border:1px solid #373f59;border-radius:11px;background:#0c1020;padding:4px 6px 4px 14px}
.form:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px #8568ed26}
.form>span{color:#79d7b2;font-size:11px}
.form input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:white;font-size:12px}
.form input::placeholder{color:#8189a3}
.go{border:0;background:#383257;color:#e9dfff;border-radius:7px;padding:7px 13px;font-size:11px;font-weight:900}
.go:hover{background:#4c407b}
.open{border:1px solid #484565;border-radius:10px;background:#28263e;color:#e4dcfc;padding:11px 13px;flex:none;font-weight:800;font-size:11px}
.open:hover:not(:disabled){background:#39314c}
.open:disabled{opacity:.4}
.stage{flex:1;min-height:0;position:relative}
.pane,.start{position:absolute;inset:0;display:none}
.pane.active{display:flex;flex-direction:column}
.pane iframe{width:100%;height:100%;border:0;flex:1;background:#fff}
.notice{display:flex;align-items:center;gap:13px;justify-content:space-between;background:#1d2034;border-bottom:1px solid #323650;padding:9px 15px;font-size:11px;color:#aeb7d1}
.notice span{flex:1;line-height:1.5}
.notice b{color:#eee7ff}
.notice button{border:1px solid #625589;background:#403458;color:#f2e9ff;border-radius:7px;padding:7px 11px;font-weight:800;flex:none;font-size:10px}
.start.active{display:grid;place-items:center;overflow:auto;background:radial-gradient(ellipse 650px 430px at 50% 43%,#3424504d,transparent 80%),radial-gradient(ellipse 520px 350px at 80% 10%,#1f3c5e33,transparent 83%),#0b0d18}
.homeinner{width:min(690px,100%);padding:28px 24px 80px;text-align:center}
.bigbrand{display:flex;align-items:center;justify-content:center;gap:15px;margin-bottom:20px}
.bigbrand .mark{width:60px;height:60px;border-radius:18px;font-size:34px}
.bigbrand strong{font-size:clamp(25px,5vw,40px);letter-spacing:3px}
.tagline{color:#959ab7;font-size:10px;font-weight:900;letter-spacing:4px;margin:0 0 36px}
.searchform{background:#1b1f33;border:1px solid #41445f;border-radius:17px;display:flex;align-items:center;gap:9px;padding:10px;box-shadow:0 17px 50px #0004}
.searchform:focus-within{border-color:var(--accent)}
.searchform input{flex:1;min-width:0;background:none;border:0;outline:0;color:white;font-size:15px;padding:6px 12px}
.searchform button{border:0;border-radius:10px;background:linear-gradient(125deg,#bdaaff,#817cff);color:#111024;padding:12px 18px;font-weight:900}
.caption{color:#929ab5;font-size:12px;margin-top:25px;line-height:1.8}
.help{display:flex;justify-content:center;flex-wrap:wrap;gap:15px;color:#8288a6;font-size:11px;margin-top:37px}
kbd{border:1px solid #41415b;border-radius:6px;padding:4px 6px;color:#b3aecd;background:#1e2132}
#message{position:fixed;z-index:4;bottom:15px;right:15px;background:#27263d;padding:13px 17px;border:1px solid #585074;border-radius:10px;color:white;display:none}
@media(max-width:740px){.brand{font-size:0;padding-right:1px}.tab{min-width:105px;flex-basis:145px}.toolbar{gap:1px;padding:6px}.tool{width:30px}.open{padding:10px 8px;font-size:0}.open:after{content:'↗';font-size:18px}.form{padding-left:8px;gap:4px}.form>span{display:none}.go{padding:7px 9px}}
@media(max-width:450px){.top{padding-left:6px;padding-right:6px}.tab{min-width:90px;flex-basis:115px}.toolbar{height:57px}.tool{width:26px;height:33px;font-size:17px}.form input{font-size:11px}.bigbrand .mark{width:45px;height:45px;border-radius:13px}.bigbrand strong{font-size:25px}.searchform input{font-size:12px}.searchform button{padding:10px}.homeinner{padding:20px 16px 45px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* In-app search and reader */
.results{flex:1;min-height:0;overflow-y:auto;background:#101322;color:#e9eaff;padding:42px max(24px,calc((100% - 790px)/2));}
.results[hidden]{display:none!important}
.results-eyebrow{display:block;font-size:10px;letter-spacing:2px;font-weight:900;color:#ba9fff;margin-bottom:15px;text-transform:uppercase}
.results-heading{font-size:clamp(31px,4.5vw,51px);line-height:1.18;letter-spacing:-1.9px;margin:0 0 13px;overflow-wrap:anywhere}
.results-intro{font-size:13px;color:#9da8c3;line-height:1.8;margin:0 0 28px}
.results-status{background:#1a2035;border:1px solid #333a56;border-radius:12px;padding:20px;color:#acb6d0;line-height:1.7}
.result-error{color:#ffadb2;background:#3a2339;border-color:#673d52}
.search-result-list{display:grid;gap:12px}
.search-result{text-align:left;display:flex;flex-direction:column;gap:8px;width:100%;background:#1b1f35;border:1px solid #353a56;color:#ecedff;padding:21px 22px;border-radius:14px;transition:background .15s,border-color .15s}
.search-result:hover{background:#282745;border-color:#aa91ff}
.result-source{font-size:10px;color:#bfa6ff;font-weight:900;letter-spacing:1.4px;text-transform:uppercase}
.result-title{font-size:18px;letter-spacing:-.25px;line-height:1.4}
.result-desc{font-size:13px;color:#aab1c9;line-height:1.75}
.result-url{font-size:11px;color:#6fe3c1;overflow-wrap:anywhere;line-height:1.6}
.result-footnote{font-size:11px;color:#919aaf;margin:22px 0 0}
.article-body{font-size:14px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere;color:#d5d9ed;margin-top:22px}
@media(max-width:540px){.results{padding:25px 17px}.search-result{padding:17px}.result-title{font-size:16px}.results-heading{font-size:30px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand"><span class="mark">S</span>SPECTRA</div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Browser tabs"></div>
  <button class="new" type="button" id="newTab" aria-label="New tab" title="New tab">+</button>
</header>
<nav class="toolbar" aria-label="Browser controls">
  <button type="button" class="tool" id="back" title="Back" aria-label="Back">←</button>
  <button type="button" class="tool" id="forward" title="Forward" aria-label="Forward">→</button>
  <button type="button" class="tool" id="reload" title="Refresh" aria-label="Refresh">↻</button>
  <button type="button" class="tool" id="home" title="Home" aria-label="Home">⌂</button>
  <form id="navform" class="form" autocomplete="off"><span>●</span><input id="address" aria-label="Website address or search" placeholder="Search or enter website address" spellcheck="false" autocapitalize="off"><button type="submit" class="go">GO ↗</button></form>
</nav>
<main class="stage" id="stage" aria-label="Browser content"></main>
</div>
<div id="message" role="status"></div>
<noscript><p>Browser JavaScript is blocked or disabled. Tabs and address controls require JavaScript.</p></noscript>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
let all=[],selected=0,serial=0,toastTimer;
const tablist=$('tabs'),stage=$('stage'),address=$('address');
function active(){return all.find(t=>t.id===selected)}
function showMessage(msg){const box=$('message');box.textContent=msg;box.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.style.display='none',3500)}
function parse(value){
  const text=value.trim();
  if(!text)return '';
  if(/^about:blank$/i.test(text))return '';
  if(/^(https?:\/\/|www\.)/i.test(text)||/^[^\s]+\.[a-z]{2,}(?:[/?#:]|$)/i.test(text)){
    try{const url=new URL(/^https?:\/\//i.test(text)?text:'https://'+text);if(['https:','http:'].includes(url.protocol)&&!url.username&&!url.password)return url.href}catch{}
    return null;
  }
  return {search:text};
}
function titleFor(url){
  if(!url)return 'New Tab';
  if(url.startsWith('spectra-search:'))return 'Search · '+decodeURIComponent(url.slice(15)).slice(0,30);
  try{return new URL(url).hostname.replace(/^www\./,'')}catch{return 'Website'}
}
function makeStart(tab){
  const screen=document.createElement('div');screen.className='start';
  screen.innerHTML='<div class="homeinner"><div class="bigbrand"><span class="mark">S</span><strong>SPECTRA</strong></div><p class="tagline">A SPACE TO EXPLORE</p><form class="searchform"><input type="text" aria-label="Web search or URL" placeholder="Search or enter website address" autocomplete="off"><button type="submit">Search ↗</button></form><p class="caption">Search results and supported pages stay inside SPECTRA.<br>Some sites do not allow embedded viewing.</p><div class="help"><span><kbd>Ctrl/⌘ + L</kbd> Address</span><span><kbd>Ctrl/⌘ + T</kbd> New tab</span></div></div>';
  screen.querySelector('form').addEventListener('submit',e=>{e.preventDefault();navigate(tab,screen.querySelector('input').value)});
  tab.start=screen;stage.appendChild(screen);
}
function makePanel(tab){
  const panel=document.createElement('div');
  panel.className='pane';
  const info=document.createElement('div');
  info.className='notice';
  const label=document.createElement('span');
  label.innerHTML='<b>In-app preview.</b> Some sites refuse embedding. Reader mode supports approved public articles only.';
  const readerButton=document.createElement('button');
  readerButton.type='button';
  readerButton.textContent='Reader mode ↗';
  readerButton.addEventListener('click',()=>loadReader(tab));
  info.append(label,readerButton);
  const results=document.createElement('div');
  results.className='results';
  results.hidden=true;
  const frame=document.createElement('iframe');
  frame.title='Embedded website preview';
  frame.referrerPolicy='no-referrer';
  frame.setAttribute('sandbox','allow-scripts allow-forms allow-same-origin');
  panel.append(info,results,frame);
  tab.panel=panel;tab.info=info;tab.results=results;tab.frame=frame;
  stage.appendChild(panel);
}
function sync(){
  const t=active();if(!t)return;
  address.value=t.url.startsWith('spectra-search:')?decodeURIComponent(t.url.slice(15)):t.url;
  $('back').disabled=t.index===0;
  $('forward').disabled=t.index===t.history.length-1;
  document.title=(t.name||'New Tab')+' — SPECTRA Browser';
}
function drawTabs(){
  tablist.replaceChildren();
  all.forEach(t=>{
    const element=document.createElement('div');element.className='tab'+(selected===t.id?' active':'');element.role='tab';element.tabIndex=0;element.setAttribute('aria-selected',selected===t.id?'true':'false');
    const symbol=document.createElement('span');symbol.className='symbol';symbol.textContent=t.url?'◈':'✦';
    const name=document.createElement('span');name.className='title';name.textContent=t.name;
    const close=document.createElement('button');close.type='button';close.className='close';close.setAttribute('aria-label','Close tab');close.textContent='×';
    close.addEventListener('click',e=>{e.stopPropagation();removeTab(t.id)});
    element.append(symbol,name,close);element.addEventListener('click',()=>activate(t.id));element.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate(t.id)}});
    tablist.appendChild(element);
  });
}
function activate(id){
  if(!all.some(t=>t.id===id))return;
  selected=id;all.forEach(t=>{t.start.classList.toggle('active',t.id===id&&!t.url);t.panel.classList.toggle('active',t.id===id&&!!t.url)});
  drawTabs();sync();
}
function createTab(){
  const t={id:++serial,url:'',name:'New Tab',history:[''],index:0,start:null,panel:null,frame:null};
  all.push(t);makeStart(t);makePanel(t);activate(t.id);return t;
}
function removeTab(id){
  const idx=all.findIndex(t=>t.id===id);if(idx<0)return;
  all[idx].start.remove();all[idx].panel.remove();all.splice(idx,1);
  if(!all.length)createTab();else if(selected===id)activate(all[Math.max(0,idx-1)].id);else drawTabs();
}
const APP_API='https://spectra-reader-lrdsot.v2.appdeploy.ai';

function addText(parent,tag,text,className){
  const node=document.createElement(tag);
  if(className)node.className=className;
  node.textContent=text;
  parent.appendChild(node);
  return node;
}

function setResultView(t){
  t.info.hidden=true;
  t.frame.hidden=true;
  t.frame.style.display='none';
  t.results.hidden=false;
  t.results.style.display='block';
  t.results.replaceChildren();
}

async function loadSearch(t,term){
  if(!term)return;
  const expected='spectra-search:'+encodeURIComponent(term);
  setResultView(t);
  const header=addText(t.results,'div','Search','results-eyebrow');
  const heading=addText(t.results,'h1',term,'results-heading');
  addText(t.results,'p','DuckDuckGo instant answers and Wikipedia reference results, displayed within SPECTRA.','results-intro');
  const status=addText(t.results,'div','Searching for answers…','results-status');
  try{
    const response=await fetch(APP_API+'/api/search?q='+encodeURIComponent(term));
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||'Search service unavailable.');
    if(t.url!==expected)return;
    status.remove();
    const results=Array.isArray(data.results)?data.results:[];
    if(!results.length){
      addText(t.results,'p','No instant answers or reference pages were found. Try a more specific search.','results-status');
      return;
    }
    const list=document.createElement('div');
    list.className='search-result-list';
    for(const result of results){
      if(!result.url||!result.title)continue;
      const card=document.createElement('button');
      card.type='button';
      card.className='search-result';
      addText(card,'span',result.source||'Reference','result-source');
      addText(card,'strong',result.title,'result-title');
      if(result.snippet)addText(card,'span',result.snippet,'result-desc');
      addText(card,'span',result.url,'result-url');
      card.addEventListener('click',()=>navigate(t,result.url));
      list.appendChild(card);
    }
    t.results.appendChild(list);
    if(Array.isArray(data.warnings)&&data.warnings.length){
      addText(t.results,'p',data.warnings.join(' · '),'result-footnote');
    }
  }catch(error){
    if(t.url!==expected)return;
    status.textContent='Search is temporarily unavailable in SPECTRA. The search service may be blocked by this network.';
    status.classList.add('result-error');
  }
}

async function loadReader(t){
  if(!t||!/^https?:\/\//i.test(t.url))return;
  const expected=t.url;
  t.mode='reader';
  setResultView(t);
  addText(t.results,'span','SPECTRA READER','results-eyebrow');
  const status=addText(t.results,'p','Loading public article…','results-status');
  try{
    const response=await fetch(APP_API+'/api/read?url='+encodeURIComponent(t.url));
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||'Page cannot be read.');
    if(t.url!==expected)return;
    status.remove();
    addText(t.results,'h1',data.title||'Public article','results-heading');
    addText(t.results,'p',data.url||expected,'result-url');
    addText(t.results,'div',data.text||'No readable content.','article-body');
  }catch(error){
    if(t.url!==expected)return;
    status.textContent=(error instanceof Error?error.message:'Reader unavailable')+
      ' This website may not support read-only viewing.';
    status.classList.add('result-error');
  }
}

function display(t,url){
  t.url=url;
  t.name=titleFor(url);
  t.mode='preview';
  if(url.startsWith('spectra-search:')){
    t.frame.removeAttribute('src');
    loadSearch(t,decodeURIComponent(url.slice(15)));
  }else if(url){
    let articleHost='';
    try{articleHost=new URL(url).hostname.toLowerCase()}catch{}
    const readable=['example.com','wikipedia.org','wiktionary.org','nasa.gov','si.edu','britannica.com','openstax.org']
      .some(host=>articleHost===host||articleHost.endsWith('.'+host));
    if(readable){
      t.frame.removeAttribute('src');
      loadReader(t);
    }else{
      t.info.hidden=false;
      t.results.hidden=true;
      t.results.style.display='none';
      t.frame.hidden=false;
      t.frame.style.display='block';
      t.frame.src=url;
    }
  }else{
    t.frame.removeAttribute('src');
    t.results.hidden=true;
  }
  if(selected===t.id)activate(t.id);else drawTabs();
}

function navigate(t,raw){
  if(!t)return;
  const to=parse(raw);
  if(to===null){showMessage('Enter a valid website address.');return}
  const destination=typeof to==='object'?'spectra-search:'+encodeURIComponent(to.search):to;
  t.history=t.history.slice(0,t.index+1);
  t.history.push(destination);
  t.index=t.history.length-1;
  display(t,destination);
}
function historyMove(by){const t=active();if(!t)return;const next=t.index+by;if(next<0||next>=t.history.length)return;t.index=next;display(t,t.history[next])}
$('newTab').addEventListener('click',()=>{createTab();address.focus()});
$('back').addEventListener('click',()=>historyMove(-1));
$('forward').addEventListener('click',()=>historyMove(1));
$('reload').addEventListener('click',()=>{
  const t=active();if(!t||!t.url)return;
  if(t.url.startsWith('spectra-search:'))loadSearch(t,decodeURIComponent(t.url.slice(15)));
  else if(t.mode==='reader')loadReader(t);
  else t.frame.src=t.url;
});
$('home').addEventListener('click',()=>navigate(active(),''));
$('navform').addEventListener('submit',e=>{e.preventDefault();navigate(active(),address.value)});
window.addEventListener('keydown',e=>{
 const mod=e.ctrlKey||e.metaKey;
 if(mod&&e.key.toLowerCase()==='l'){e.preventDefault();address.focus();address.select()}
 else if(mod&&e.key.toLowerCase()==='t'){e.preventDefault();createTab();address.focus()}
 else if(mod&&e.key.toLowerCase()==='w'){e.preventDefault();removeTab(selected)}
 else if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();historyMove(-1)}
 else if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();historyMove(1)}
});
createTab();
})();
</script>
</body>
</html>
